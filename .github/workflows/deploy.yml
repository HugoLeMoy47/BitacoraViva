# Despliegue del sitio (Cloudflare Worker) tras un CI en verde sobre `main`.
#
# Queda detenido hasta que una persona revisora del entorno «production» lo apruebe
# (GitHub → Settings → Environments → production → Required reviewers).
# Solo publica el sitio: las migraciones (`db push`) siguen siendo un paso manual del Product Owner.
# Secretos del entorno: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
#
# Se puede lanzar a mano desde la pestaña Actions («Run workflow») sobre `main`.

name: Despliegue

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  desplegar:
    name: Publicar el Worker
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publicar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy
