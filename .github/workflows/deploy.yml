# Despliegue del sitio (Cloudflare Worker) tras un CI en verde sobre `main`.
#
# Cómo se usa: después de fusionar a `main`, el CI corre solo y, si pasan sus trabajos OBLIGATORIOS
# («Verificación estática» y «Pruebas de seguridad (base local)»), aparece aquí un
# despliegue «automático» que ESPERA TU APROBACIÓN (Actions → Despliegue → «Review deployments» →
# production → «Approve and deploy»). No hace falta lanzar nada a mano.
#
# La «Auditoría de interfaz» es informativa: sigue corriendo y se ve en rojo si falla, pero NO frena el
# despliegue (es la única parte del CI con intermitencias propias de la velocidad de la máquina).
#
# Antes de pedir aprobación, un primer paso compara el commit publicado (/version.json) con el que se
# quiere publicar. Si ya es el mismo, el despliegue se omite solo: así un segundo disparo del mismo commit
# (por ejemplo, el botón «Run workflow») no pide una aprobación inútil. Para publicar de nuevo a propósito
# el mismo commit, lanzarlo a mano marcando «forzar».
#
# Solo publica el sitio: las migraciones (`db push`) siguen siendo un paso manual del Product Owner.
# Secretos del entorno «production»: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.

name: Despliegue

run-name: Despliegue (${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automático tras el CI' }}) · ${{ github.event.workflow_run.display_title || 'a mano sobre main' }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Publicar aunque ese commit ya esté publicado'
        type: boolean
        default: false

concurrency:
  group: despliegue
  cancel-in-progress: false

env:
  # Dirección pública del sitio: de ahí se lee qué commit está publicado
  SITIO: https://bitacoraviva.freejolitos.consulting
  OBJETIVO: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  comprobar:
    name: Ver qué hay publicado
    # También cuando el CI terminó en rojo: puede ser solo la auditoría de interfaz, y eso se decide abajo
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - id: ci
        name: Ver que pasaron los trabajos obligatorios del CI
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          trabajos="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs" --paginate --jq '.jobs[] | "\(.name)=\(.conclusion)"')"
          echo "$trabajos"
          falta=""
          for obligatorio in "Verificación estática" "Pruebas de seguridad (base local)"; do
            printf '%s\n' "$trabajos" | grep -qxF "$obligatorio=success" || falta="$falta «$obligatorio»"
          done
          if [ -n "$falta" ]; then
            echo "No pasaron los trabajos obligatorios:$falta. No se despliega."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "Los trabajos obligatorios pasaron (la auditoría de interfaz es informativa)."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - id: v
        env:
          FORZAR: ${{ inputs.forzar }}
          CI_OK: ${{ steps.ci.outputs.ok }}
        run: |
          vivo="$(curl -fsS --max-time 20 "$SITIO/version.json" | jq -r '.commit // empty' || true)"
          objetivo="${OBJETIVO:0:7}"
          echo "Publicado: ${vivo:-no se pudo leer} · A publicar: $objetivo"
          if [ "$CI_OK" = "false" ]; then
            echo "El CI no cumplió lo obligatorio: no se publica."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          elif [ "$FORZAR" = "true" ]; then
            echo "Se pidió forzar: se publica."
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$vivo" ] && [ "$vivo" = "$objetivo" ]; then
            echo "Ese commit ya está publicado: no hay nada que desplegar."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

  desplegar:
    name: Publicar el Worker (espera tu aprobación)
    needs: comprobar
    if: needs.comprobar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OBJETIVO }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar
        env:
          # El pie del sitio muestra este commit: tiene que ser el que se compila, no el último de main
          BUILD_COMMIT: ${{ env.OBJETIVO }}
        run: npm run build
      - name: Publicar en Cloudflare
        env:
          TOKEN_CRUDO: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA_CRUDA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Los secretos a veces se guardan con un salto de línea al final: se recortan
          export CLOUDFLARE_API_TOKEN="$(printf %s "$TOKEN_CRUDO" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CUENTA_CRUDA" | tr -d '[:space:]')"
          npx --yes wrangler@4.149.0 deploy
