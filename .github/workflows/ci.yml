# Integración continua de Bitácora Viva (RNF-06 · riesgo R-01).
#
# Una base de Postgres EFÍMERA (supabase start) recibe todas las migraciones desde cero y la semilla,
# y sobre ella corren las pruebas negativas de seguridad. No toca la demo compartida ni necesita
# ningún token con acceso a ella. Si una migración depende de algo que solo existe en la demo,
# aquí falla.
#
# Para que sea BLOQUEANTE: en GitHub → Settings → Branches → regla para `main` → exigir que pasen
# los checks «Verificación estática» y «Pruebas de seguridad (base local)» antes de fusionar.
#
# No hace despliegues: publicar el sitio y empujar migraciones (`db push`) siguen siendo pasos
# deliberados del Product Owner (R-13).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Verificación estática
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sin secretos en el repositorio (Regla Dura 2)
        run: |
          npm run scan:secrets -- --self-test
          npm run scan:secrets
      - name: Tipos y compilación
        run: npm run build
      - name: Toda clave de traducción usada existe (Regla Dura 9)
        run: npm run check:i18n
      - name: Cero literales de texto en componentes (Regla Dura 9)
        run: npm run check:literals
      - name: Un modal es para decisiones cortas (más de 3 campos va en una página)
        run: npm run check:modales
      - name: Cada error de la base tiene su código y su texto (E13)
        run: npm run check:errores
      - name: Ningún texto menor de 12 px (lo mismo que mide el auditor, en un segundo)
        run: npm run check:tamano-texto
      - name: Cada tabla con auditoría tiene su etiqueta en pantalla (no se muestra el nombre técnico)
        run: npm run check:etiquetas-auditoria
      - name: Pruebas unitarias
        run: npm run test:unit

  database:
    name: Pruebas de seguridad (base local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Levantar Supabase local (migraciones desde cero + semilla)
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Pruebas negativas de RLS y reglas duras
        run: npm run test:rls -- --local
      - name: Diagnóstico si falló
        if: failure()
        run: |
          docker ps -a
          docker logs supabase_db_bitacora-viva 2>&1 | tail -60
          # Las anotaciones se leen sin abrir el log completo
          LOGS=$(docker logs supabase_db_bitacora-viva 2>&1 | tail -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=log-de-la-base::${LOGS:0:5000}"

  ui:
    name: Auditoría de interfaz (base local)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Levantar Supabase local (migraciones desde cero + semilla demo)
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Compilar contra la base local
        run: |
          # Las variables del entorno tienen prioridad sobre .env.production (que apunta a la demo)
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed 's/^/export /')"
          echo "API_URL definida: ${API_URL:+sí} · ANON_KEY definida: ${ANON_KEY:+sí}"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build
      - name: Auditoría de interfaz (6 roles × 5 anchos, teclado, contraste, modales)
        run: npm run audit:ui
      - name: Diagnóstico si falló
        if: failure()
        run: |
          docker ps -a
          which google-chrome microsoft-edge || true
